<script>
/**
 * CHOPPERS MENS WEAR · POS — Standalone Frontend for External Hosting
 * Hosted outside Google Apps Script (Netlify, Vercel, GitHub Pages, Cloudflare Pages, or custom domain).
 * Talks to Google Apps Script Web App API via CORS fetch() (text/plain POST + GET) with JSONP & local cache fallback.
 */
const DEFAULT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyva9WNO6EHdlZVuFoSANhjIZBOhH5VIEqNghKWompVekDG0YyO4Q4B8HvIm-Dushg_/exec";
const STORAGE_KEY_DB = "cmw_external_pos_db_v1";
const STORAGE_KEY_CFG = "cmw_external_pos_cfg_v1";

function loadStore(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveStore(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {}
}

let hostConfig = Object.assign({
  apiUrl: DEFAULT_WEB_APP_URL,
  mode: "auto", // "auto" (Cloud API with local fallback) or "local" (Browser Local Storage only)
  spreadsheetUrl: "https://docs.google.com/spreadsheets/d/1Ac-tkxta9kGb56Do0qrGiH6wY8CgVkKq9tmLypVicck/edit"
}, loadStore(STORAGE_KEY_CFG, {}));

let WEB_APP_URL = hostConfig.apiUrl || DEFAULT_WEB_APP_URL;
const $ = s => document.querySelector(s);

const DEFAULT_DB = {
  products: [
    { SKU: "CMW-1001", Name: "Oxford Cotton Formal Shirt - White", Category: "Shirts", Barcode: "8901001", CostPrice: 650, SellingPrice: 1299, TaxRate: 5, Stock: 24, LowStockAt: 5 },
    { SKU: "CMW-1002", Name: "Slim Fit Stretch Chino Trousers - Navy", Category: "Trousers", Barcode: "8901002", CostPrice: 820, SellingPrice: 1699, TaxRate: 12, Stock: 18, LowStockAt: 5 },
    { SKU: "CMW-1003", Name: "Selvedge Denim Jeans - Indigo Wash", Category: "Denim", Barcode: "8901003", CostPrice: 980, SellingPrice: 2199, TaxRate: 12, Stock: 14, LowStockAt: 4 },
    { SKU: "CMW-1004", Name: "Pique Polo T-Shirt - Olive Green", Category: "T-Shirts", Barcode: "8901004", CostPrice: 420, SellingPrice: 899, TaxRate: 5, Stock: 4, LowStockAt: 5 },
    { SKU: "CMW-1005", Name: "Tailored Linen Blazer - Charcoal", Category: "Suits & Blazers", Barcode: "8901005", CostPrice: 2100, SellingPrice: 4499, TaxRate: 12, Stock: 3, LowStockAt: 4 },
    { SKU: "CMW-1006", Name: "Full Grain Leather Reversible Belt", Category: "Accessories", Barcode: "8901006", CostPrice: 310, SellingPrice: 699, TaxRate: 18, Stock: 19, LowStockAt: 5 }
  ],
  customers: [
    { CustomerID: "CUST-101", Name: "Arjun Mehta", Phone: "9876543210", Email: "arjun.mehta@example.com", Address: "T. Nagar, Chennai" },
    { CustomerID: "CUST-102", Name: "Karthik Subramanian", Phone: "9840112233", Email: "karthik.s@example.com", Address: "Anna Nagar, Chennai" }
  ],
  sales: [
    { InvoiceNo: "INV-20261101-1015", DateTime: new Date(Date.now() - 3600 * 1000 * 3).toISOString(), CustomerName: "Arjun Mehta", Phone: "9876543210", Subtotal: 2998, Discount: 100, Tax: 256.83, GrandTotal: 3154.83, PaymentMode: "UPI", Cashier: "Admin" }
  ],
  settings: {
    ShopName: "CHOPPERS MEANS WEAR",
    Address: "Main Commercial Street, Chennai",
    Phone: "+91 98400 00000",
    GSTIN: "33AABCC1234D1Z5",
    Cashier: "Admin",
    ReturnPolicy: "Exchange within 7 days with bill"
  }
};

let db = loadStore(STORAGE_KEY_DB, DEFAULT_DB);
let cart = [], page = 'dashboard', lastBill = null;
let connectionState = { online: false, source: 'connecting', lastError: '', lastSync: '' };

const fmt = n => '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function updateConnectionBadge(online, label, errText = '') {
  connectionState.online = online;
  connectionState.source = label;
  connectionState.lastError = errText;
  if (online) connectionState.lastSync = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  const pill = $('#connPill');
  const side = $('#sideStatus');
  if (pill) {
    pill.className = 'pill ' + (online ? 'good' : 'warn');
    pill.textContent = online ? '● Sheets API Connected' : '● Local / Offline Mode';
  }
  if (side) {
    side.innerHTML = online
      ? `EXTERNAL STATIC HOST<br>● Connected to Google Sheets`
      : `EXTERNAL STATIC HOST<br>● Local storage active`;
  }
}

/**
 * Multi-transport external API client:
 * 1. Tries CORS fetch() POST with text/plain;charset=utf-8 (avoids OPTIONS preflight on Apps Script).
 * 2. Falls back to CORS fetch() GET with query params.
 * 3. Falls back to JSONP <script> callback for legacy Code.gs deployments.
 */
function parseApiResult(rawText) {
  let text = String(rawText || '').trim();
  const jsonpMatch = text.match(/^[a-zA-Z0-9_$]+\(([\s\S]*)\);?$/);
  if (jsonpMatch) text = jsonpMatch[1];
  return JSON.parse(text);
}

async function fetchViaCors(action, payload) {
  const endpoint = (hostConfig.apiUrl || DEFAULT_WEB_APP_URL).trim();
  if (!endpoint) throw new Error('Missing Google Apps Script Web App URL in Settings.');

  // Strategy 1: CORS simple POST (text/plain avoids preflight OPTIONS request on script.google.com)
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 14000);
    const res = await fetch(endpoint, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: String(action), payload: payload || {} }),
      signal: controller.signal
    });
    clearTimeout(timer);
    if (res.ok) {
      const parsed = parseApiResult(await res.text());
      if (parsed && parsed.ok) return parsed.data;
      if (parsed && parsed.error) throw new Error(parsed.error);
    }
  } catch (postErr) {
    if (postErr && postErr.message && !/Failed to fetch|NetworkError|aborted|Unexpected token/i.test(postErr.message)) {
      throw postErr;
    }
  }

  // Strategy 2: CORS GET request
  const query = new URLSearchParams({
    action: String(action),
    payload: JSON.stringify(payload || {}),
    _: String(Date.now())
  });
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 14000);
  const res = await fetch(endpoint + '?' + query.toString(), {
    method: 'GET',
    mode: 'cors',
    redirect: 'follow',
    signal: controller.signal
  });
  clearTimeout(timer);
  const parsed = parseApiResult(await res.text());
  if (!parsed || !parsed.ok) {
    throw new Error(parsed && parsed.error ? parsed.error : 'Google Apps Script request failed');
  }
  return parsed.data;
}

function fetchViaJsonp(action, payload = {}) {
  const endpoint = (hostConfig.apiUrl || DEFAULT_WEB_APP_URL).trim();
  return new Promise((resolve, reject) => {
    const callback = 'cmw_jsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timer = setTimeout(() => finish(new Error('Google Sheets request timed out.')), 15000);
    function cleanup() {
      clearTimeout(timer);
      delete window[callback];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    function finish(err, result) {
      cleanup();
      if (err) reject(err);
      else if (!result || !result.ok) reject(new Error(result && result.error ? result.error : 'Google Apps Script request failed'));
      else resolve(result.data);
    }
    window[callback] = result => finish(null, result);
    script.onerror = () => finish(new Error('Could not reach the Google Apps Script API from external host.'));
    const query = new URLSearchParams({
      action: String(action),
      payload: JSON.stringify(payload || {}),
      callback: callback,
      _: String(Date.now())
    });
    script.src = endpoint + '?' + query.toString();
    document.head.appendChild(script);
  });
}

function applyLocalAction(action, payload = {}) {
  db = loadStore(STORAGE_KEY_DB, db || DEFAULT_DB);
  if (action === 'init' || action === 'ping') {
    saveStore(STORAGE_KEY_DB, db);
    return db;
  }
  if (action === 'saveProduct') {
    const sku = String(payload.SKU || '').trim() || ('CMW-' + Date.now().toString().slice(-5));
    const item = {
      SKU: sku,
      Name: String(payload.Name || '').trim(),
      Category: String(payload.Category || 'Apparel').trim(),
      Barcode: String(payload.Barcode || '').trim(),
      CostPrice: Number(payload.CostPrice || 0),
      SellingPrice: Number(payload.SellingPrice || 0),
      TaxRate: Number(payload.TaxRate || 0),
      Stock: Number(payload.Stock ?? 0),
      LowStockAt: Number(payload.LowStockAt ?? 5)
    };
    const idx = db.products.findIndex(x => x.SKU === sku);
    if (idx >= 0) db.products[idx] = item;
    else db.products.unshift(item);
    saveStore(STORAGE_KEY_DB, db);
    return { SKU: sku };
  }
  if (action === 'saveCustomer') {
    const id = String(payload.CustomerID || '').trim() || ('CUST-' + Date.now().toString().slice(-5));
    const cust = {
      CustomerID: id,
      Name: String(payload.Name || '').trim(),
      Phone: String(payload.Phone || '').trim(),
      Email: String(payload.Email || '').trim(),
      Address: String(payload.Address || '').trim()
    };
    db.customers.unshift(cust);
    saveStore(STORAGE_KEY_DB, db);
    return cust;
  }
  if (action === 'saveSettings') {
    db.settings = Object.assign({}, db.settings, payload);
    saveStore(STORAGE_KEY_DB, db);
    return db.settings;
  }
  if (action === 'checkout') {
    const nowIso = new Date().toISOString();
    const invoice = 'INV-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + Math.floor(1000 + Math.random() * 9000);
    let subtotal = 0, tax = 0;
    const billedItems = (payload.items || []).map(req => {
      const p = db.products.find(x => x.SKU === req.SKU);
      if (!p) throw new Error('Product not found: ' + req.SKU);
      const qty = Number(req.Qty || 0);
      if (qty > p.Stock) throw new Error('Not enough stock for ' + p.Name);
      p.Stock -= qty;
      const rate = Number(p.SellingPrice || 0);
      const taxRate = Number(p.TaxRate || 0);
      const disc = Number(req.Discount || 0);
      const taxable = Math.max(0, rate * qty - disc);
      const taxAmt = taxable * taxRate / 100;
      const lineTotal = taxable + taxAmt;
      subtotal += rate * qty;
      tax += taxAmt;
      return { SKU: p.SKU, Name: p.Name, Qty: qty, Rate: rate, Discount: disc, TaxRate: taxRate, TaxAmount: taxAmt, LineTotal: lineTotal };
    });
    const discount = Math.max(0, Number(payload.discount || 0));
    const grandTotal = Math.max(0, subtotal - discount + tax);
    const customer = {
      Name: (payload.customer && payload.customer.Name) ? payload.customer.Name : 'Walk-in',
      Phone: (payload.customer && payload.customer.Phone) ? payload.customer.Phone : ''
    };
    if (customer.Name !== 'Walk-in' && !db.customers.some(c => c.Name.toLowerCase() === customer.Name.toLowerCase() || (customer.Phone && c.Phone === customer.Phone))) {
      db.customers.unshift({ CustomerID: 'CUST-' + Date.now().toString().slice(-5), Name: customer.Name, Phone: customer.Phone, Email: '', Address: '' });
    }
    db.sales.unshift({
      InvoiceNo: invoice,
      DateTime: nowIso,
      CustomerName: customer.Name,
      Phone: customer.Phone,
      Subtotal: subtotal,
      Discount: discount,
      Tax: tax,
      GrandTotal: grandTotal,
      PaymentMode: payload.paymentMode || 'Cash',
      Cashier: payload.cashier || 'Admin'
    });
    saveStore(STORAGE_KEY_DB, db);
    return { invoice, dateTime: nowIso, customer, items: billedItems, subtotal, discount, tax, grandTotal, paymentMode: payload.paymentMode || 'Cash' };
  }
  return null;
}

async function api(action, payload = {}) {
  if (hostConfig.mode === 'local') {
    updateConnectionBadge(false, 'local', 'Local Browser Storage Mode enabled in Settings.');
    return applyLocalAction(action, payload);
  }
  try {
    let data;
    try {
      data = await fetchViaCors(action, payload);
    } catch (corsErr) {
      data = await fetchViaJsonp(action, payload);
    }
    if (action === 'init' && data && Array.isArray(data.products)) {
      db = data;
      saveStore(STORAGE_KEY_DB, db);
    }
    updateConnectionBadge(true, 'cloud', '');
    return data;
  } catch (err) {
    const msg = err && err.message ? err.message : 'Could not reach Google Apps Script API';
    updateConnectionBadge(false, 'fallback', msg);
    // Seamlessly fall back to cached local storage so external static hosting never locks out the cashier
    return applyLocalAction(action, payload);
  }
}

function addToCart(sku) {
  let p = db.products.find(x => x.SKU === sku);
  if (!p) return;
  let x = cart.find(i => i.SKU === sku);
  if (x) {
    if (x.Qty >= p.Stock) return toast('Not enough stock');
    x.Qty++;
  } else {
    cart.push({ SKU: sku, Name: p.Name, Rate: Number(p.SellingPrice), TaxRate: Number(p.TaxRate), Qty: 1, Stock: p.Stock, Discount: 0 });
  }
  drawCart();
}

function changeQty(sku, d) {
  let x = cart.find(i => i.SKU === sku);
  if (!x) return;
  x.Qty += d;
  if (x.Qty < 1) cart = cart.filter(i => i.SKU !== sku);
  else if (x.Qty > x.Stock) { x.Qty = x.Stock; toast('Stock limit reached'); }
  drawCart();
}

function removeFromCart(sku) {
  cart = cart.filter(i => i.SKU !== sku);
  drawCart();
}

function clearCart() {
  cart = [];
  drawCart();
}

function drawCart() {
  let host = $('#cartItems');
  if (!host) return;
  host.innerHTML = cart.length ? cart.map(x => `<div class="cartitem"><div><strong>${esc(x.Name)}</strong><small>${fmt(x.Rate)} each · GST ${x.TaxRate}%</small><div class="qty"><button onclick="changeQty('${esc(x.SKU)}',-1)">−</button><span>${x.Qty}</span><button onclick="changeQty('${esc(x.SKU)}',1)">＋</button><button class="danger" onclick="removeFromCart('${esc(x.SKU)}')">×</button></div></div><strong>${fmt(x.Rate * x.Qty)}</strong></div>`).join('') : '<div class="empty">Your bill is empty.<br>Choose products to begin.</div>';
  let sub = cart.reduce((a, x) => a + x.Rate * x.Qty, 0),
      tax = cart.reduce((a, x) => a + Math.max(0, x.Rate * x.Qty - x.Discount) * x.TaxRate / 100, 0),
      disc = Math.max(0, Number($('#billDiscount')?.value || 0)),
      grand = Math.max(0, sub - disc + tax);
  $('#cartTotals').innerHTML = `<div class="totalrow"><span>Subtotal</span><strong>${fmt(sub)}</strong></div><div class="totalrow"><span>GST (estimated)</span><strong>${fmt(tax)}</strong></div><div class="totalrow"><span>Discount</span><strong>− ${fmt(disc)}</strong></div><div class="totalrow grand"><span>Total due</span><span>${fmt(grand)}</span></div>`;
}

async function checkout() {
  if (!cart.length) return toast('Add products first');
  let name = $('#billCustomer').value.trim(),
      phone = $('#billPhone').value.trim();
  let c = db.customers.find(x => x.Name.toLowerCase() === name.toLowerCase() || x.Phone === name);
  if (c) {
    name = c.Name;
    if (!phone) phone = c.Phone;
  }
  let btn = document.querySelector('.cartcard .primary');
  btn.disabled = true;
  btn.textContent = 'Saving sale…';
  try {
    let bill = await api('checkout', {
      items: cart.map(x => ({ SKU: x.SKU, Qty: x.Qty, Discount: x.Discount })),
      discount: Number($('#billDiscount').value || 0),
      customer: { Name: name, Phone: phone },
      paymentMode: $('#paymentMode').value,
      cashier: db.settings.Cashier || 'Admin'
    });
    lastBill = bill;
    cart = [];
    await refresh();
    go('pos');
    renderReceipt(bill);
    window.print();
    toast('Sale saved · ' + bill.invoice);
  } catch (e) {
    toast(e.message);
  } finally {
    if (document.querySelector('.cartcard .primary')) {
      document.querySelector('.cartcard .primary').disabled = false;
      document.querySelector('.cartcard .primary').textContent = 'Complete sale & print ↗';
    }
  }
}

function exportBackupJson() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'choppers-pos-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup JSON downloaded');
}

function copyBackendCode() {
  const codeEl = $('#backendCodeSnippet');
  if (!codeEl) return;
  const text = codeEl.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('Code.gs copied to clipboard')).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('Code.gs copied to clipboard'); } catch (e) { toast('Copy failed'); }
  document.body.removeChild(ta);
}

  return respond_(handleAction_(body.action || p.action || 'init', body.payload || {}), p.callback);
}

function respond_(obj, callback) {
  const json = JSON.stringify(obj);
  if (callback) {
    return ContentService.createTextOutput(callback + '(' + json + ');')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(json)
    .setMimeType(ContentService.MimeType.JSON);
}`;
  showModal(`<div class="modalhead"><h3>External Hosting & Headless Apps Script Setup</h3><button class="secondary" onclick="closeModal()">✕</button></div>
  <p class="smallnote">To host this POS outside Google Apps Script (e.g. <strong>Netlify, Vercel, GitHub Pages, Cloudflare Pages, or cPanel</strong>):</p>
  <ol class="smallnote" style="padding-left:18px;margin-bottom:14px">
    <li><strong>Deploy Frontend Externally:</strong> Upload <code>index.html</code> (from the downloadable ZIP package) to Netlify Drop, Vercel, GitHub Pages, or your web server.</li>
    <li><strong>Use Apps Script Only as a JSON API:</strong> In your Google Sheet (<em>Extensions → Apps Script</em>), remove <code>HtmlService</code> from <code>Code.gs</code> and deploy as a Web App (<em>Execute as: Me</em>, <em>Who has access: Anyone</em>).</li>
    <li><strong>Paste Your <code>/exec</code> URL:</strong> In <em>Settings → External Hosting & Google Sheets API</em>, paste your Web App URL and click <strong>Save API connection</strong>.</li>
  </ol>
  <div class="cardhead"><h3>Headless API Router (Code.gs)</h3><button class="secondary" onclick="copyBackendCode()">Copy snippet</button></div>
  <pre class="codebox" id="backendCodeSnippet">${esc(snippet)}</pre>`);
}

function salesPage() {
  $('#content').innerHTML = `${connectionBannerHtml()}<div class="heading"><div><div class="eyebrow">Transaction ledger</div><h2>Sales history</h2><p>Latest completed bills and payment modes.</p></div><button class="secondary" onclick="refresh()">↻ Refresh</button></div><div class="card"><div class="toolbar"><input class="search" id="salesSearch" placeholder="Search invoice, customer or payment…" oninput="filterSales()"></div><div id="salesTable"></div></div>`;
  filterSales();
}

function filterSales() {
  let q = ($('#salesSearch')?.value || '').toLowerCase(),
      s = db.sales.filter(x => [x.InvoiceNo, x.CustomerName, x.Phone, x.PaymentMode].join(' ').toLowerCase().includes(q));
  $('#salesTable').innerHTML = salesTable(s);
}

function showModal(html) {
  $('#modalHost').innerHTML = `<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}

function closeModal() {
  $('#modalHost').innerHTML = '';
}

refresh();
</script>
