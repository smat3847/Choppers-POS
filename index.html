<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#151515;--muted:#777;--line:#e6e6e3;--dark:#111;--soft:#f7f7f5;--green:#176b45;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;font-weight:650}.primary{background:#111;color:white}.secondary{background:#f0f0ed;color:#111;border:1px solid var(--line)}.danger{color:var(--red);background:#fff1ef}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#101010;color:white;padding:24px 16px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:11px;padding:0 7px}.logo{width:40px;height:40px;background:white;color:#111;border-radius:12px;display:grid;place-items:center;font-weight:950;font-size:18px}.brand strong{display:block;letter-spacing:.8px;font-size:13px}.brand small{color:#aaa;font-size:11px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#aaa;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#292929;color:white}.side-bottom{margin-top:auto;color:#999;font-size:11px;padding:8px}.main{min-width:0}.topbar{height:76px;padding:0 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.8)}.topbar h1{font-size:21px;margin:0;letter-spacing:-.5px}.topright{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.avatar{width:34px;height:34px;background:#111;color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800}.content{padding:28px;max-width:1600px;margin:auto}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:1.7px;color:var(--muted);font-weight:800}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.heading h2{font-size:28px;margin:5px 0 0;letter-spacing:-1px}.heading p{color:var(--muted);margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:26px;letter-spacing:-.7px;margin:8px 0 3px}.stat small{color:var(--muted);font-size:11px}.panelgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:18px}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.cardhead h3{margin:0;font-size:15px}.cardhead span{font-size:11px;color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:800;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #f0f0ed;font-size:12px}tr:last-child td{border-bottom:0}.pill{border-radius:30px;padding:5px 8px;background:#eee;font-size:10px;font-weight:750}.pill.low{background:#fff0ed;color:#b42318}.pill.good{background:#e7f5ec;color:#176b45}.empty{padding:35px;text-align:center;color:var(--muted)}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;color:#666;font-weight:750}.field input,.field select,.search{width:100%;border:1px solid #deded9;background:white;border-radius:9px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.search:focus{border-color:#111;box-shadow:0 0 0 2px #1111}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.toolbar .search{max-width:380px}.badge{background:#eee;border-radius:7px;padding:5px 8px;font-size:11px}.poslayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}.productgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.producttile{border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;color:#111}.producttile:hover{border-color:#111;transform:translateY(-1px)}.producttile strong{font-size:13px;white-space:normal}.producttile small{color:#888}.producttile .price{font-size:18px;font-weight:850;margin-top:12px}.cartcard{position:sticky;top:16px}.cartitem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.cartitem strong{font-size:12px}.cartitem small{display:block;color:#888;margin-top:4px}.qty{display:flex;align-items:center;gap:7px;margin-top:8px}.qty button{padding:3px 8px;border:1px solid var(--line);background:#fafafa;border-radius:6px}.qty span{font-size:12px;font-weight:750}.totalrow{display:flex;justify-content:space-between;margin:9px 0;color:#666;font-size:12px}.totalrow.grand{border-top:1px solid var(--line);padding-top:13px;margin-top:13px;color:#111;font-weight:850;font-size:18px}.full{width:100%}.notice{padding:12px 14px;border-radius:10px;background:#f0f0ed;color:#555;font-size:12px;margin-bottom:15px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 25px 80px #0003}.modal h3{margin:0 0 18px;font-size:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;bottom:22px;right:22px;background:#111;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 30px #0002;z-index:20}.loading{padding:50px;text-align:center;color:#888}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.smallnote{font-size:11px;color:#888}.receipt{display:none}
@media(max-width:1000px){.app{grid-template-columns:75px 1fr}.sidebar{padding:20px 10px}.brand{justify-content:center;padding:0}.brandtext,.nav .label,.side-bottom{display:none}.nav button{justify-content:center;font-size:18px}.content{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.poslayout{grid-template-columns:minmax(0,1fr) 320px}.productgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:5;bottom:0;left:0;right:0;height:62px;padding:6px 10px;display:block}.brand,.side-bottom{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{display:flex;flex-direction:column;gap:1px;padding:5px 10px;font-size:16px}.nav .label{display:block;font-size:9px}.main{padding-bottom:65px}.topbar{height:62px;padding:0 16px}.topbar h1{font-size:17px}.topright .date{display:none}.content{padding:16px}.heading{align-items:flex-start}.heading h2{font-size:24px}.grid{gap:9px}.stat,.card{padding:13px;border-radius:13px}.stat strong{font-size:22px}.panelgrid,.poslayout,.settingsgrid{grid-template-columns:1fr}.cartcard{position:static;order:-1}.productgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.producttile{min-height:105px;padding:11px}.toolbar{flex-wrap:wrap}.toolbar .search{max-width:none}.row{gap:8px}.heading .actions{justify-content:flex-end}.heading .actions button{padding:9px;font-size:11px}}
@media print{body{background:white}.app,.modalback,.toast{display:none!important}.receipt{display:block!important;font:11px/1.35 monospace;width:72mm;color:#000;margin:0 auto}.receipt h2,.receipt p{text-align:center;margin:3px 0}.receipt table{font:10px monospace;width:100%;white-space:normal}.receipt th,.receipt td{padding:3px 1px;color:#000;border-bottom:1px dashed #aaa}.receipt .rline{display:flex;justify-content:space-between;margin:3px 0}.receipt .center{text-align:center}.receipt .cut{border-top:1px dashed #000;margin:7px 0}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">C</div><div class="brandtext"><strong>CHOPPERS</strong><small>MEANS WEAR · POS</small></div></div>
  <nav class="nav">
    <button class="active" data-page="dashboard" onclick="go('dashboard')"><span>◫</span><span class="label">Overview</span></button>
    <button data-page="pos" onclick="go('pos')"><span>▣</span><span class="label">New bill</span></button>
    <button data-page="products" onclick="go('products')"><span>◈</span><span class="label">Products</span></button>
    <button data-page="customers" onclick="go('customers')"><span>♙</span><span class="label">Customers</span></button>
    <button data-page="sales" onclick="go('sales')"><span>▤</span><span class="label">Sales</span></button>
    <button data-page="settings" onclick="go('settings')"><span>⚙</span><span class="label">Settings</span></button>
  </nav>
  <div class="side-bottom">CONNECTED TO GOOGLE SHEETS<br>● Live data workspace</div>
</aside>
<main class="main">
<header class="topbar"><h1 id="topTitle">Overview</h1><div class="topright"><span class="date" id="today"></span><div class="avatar">C</div></div></header>
<div class="content" id="content"><div class="loading">Connecting to your store data…</div></div>
</main>
</div>
<div class="receipt" id="receipt"></div>
<div id="modalHost"></div><div id="toastHost"></div>
<script>
// Deployed Google Apps Script backend URL. JSONP lets this frontend run on external static hosting.
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyva9WNO6EHdlZVuFoSANhjIZBOhH5VIEqNghKWompVekDG0YyO4Q4B8HvIm-Dushg_/exec";
const $=s=>document.querySelector(s);
let db={products:[],customers:[],sales:[],settings:{}}, cart=[], page='dashboard', lastBill=null;
const fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(action,payload={}){
  // JSONP is used instead of fetch() because Apps Script ContentService cannot
  // set CORS response headers. The server returns callback({ok,data/error}).
  return new Promise((resolve,reject)=>{
    const callback='cmw_jsonp_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    let timer=setTimeout(()=>finish(new Error('Google Sheets request timed out. Check the Apps Script deployment and try again.')),25000);
    function cleanup(){clearTimeout(timer);delete window[callback];if(script.parentNode)script.parentNode.removeChild(script)}
    function finish(err,result){cleanup();if(err)reject(err);else if(!result||!result.ok)reject(new Error(result&&result.error?result.error:'Google Apps Script request failed'));else resolve(result.data)}
    window[callback]=result=>finish(null,result);
    script.onerror=()=>finish(new Error('Could not reach the Google Apps Script API. Deploy the updated Code.gs as a new version and verify web-app access permissions.'));
    const query=new URLSearchParams({action:String(action),payload:JSON.stringify(payload||{}),callback:callback,_:String(Date.now())});
    script.src=WEB_APP_URL+'?'+query.toString();
    document.head.appendChild(script);
  });
}
function toast(s){$('#toastHost').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('#toastHost').innerHTML='',3000)}
function day(){return new Date().toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
function setTitle(t){$('#topTitle').textContent=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
async function refresh(){try{db=await api('init');$('#today').textContent=day();render()}catch(e){$('#content').innerHTML=`<div class="card"><h3>Could not connect to Google Sheets</h3><p>${esc(e.message)}</p><p>Check that the Apps Script is deployed and the spreadsheet permissions are correct.</p><button class="primary" onclick="refresh()">Try again</button></div>`}}
function go(p){page=p;setTitle(({dashboard:'Overview',pos:'New bill',products:'Products & inventory',customers:'Customer directory',sales:'Sales history',settings:'Store settings'})[p]);render()}
function render(){setTitle(({dashboard:'Overview',pos:'New bill',products:'Products & inventory',customers:'Customer directory',sales:'Sales history',settings:'Store settings'})[page]);({dashboard:dashboard,pos:posPage,products:productsPage,customers:customersPage,sales:salesPage,settings:settingsPage}[page]||dashboard)()}
function dashboard(){let total=db.sales.reduce((a,s)=>a+Number(s.GrandTotal||0),0),low=db.products.filter(p=>p.Stock<=p.LowStockAt),stock=db.products.reduce((a,p)=>a+Number(p.Stock||0),0);
$('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">Store performance</div><h2>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}.</h2><p>Here's what's happening at your store today.</p></div><button class="primary" onclick="go('pos')">＋ Create new bill</button></div>
<div class="grid"><div class="stat"><label>Sales shown · latest 10</label><strong>${fmt(total)}</strong><small>Recent transactions</small></div><div class="stat"><label>Products in catalog</label><strong>${db.products.length}</strong><small>${stock} units in stock</small></div><div class="stat"><label>Customers</label><strong>${db.customers.length}</strong><small>Saved customer profiles</small></div><div class="stat"><label>Low stock alerts</label><strong>${low.length}</strong><small>${low.length?'Items need attention':'Stock levels look good'}</small></div></div>
<div class="panelgrid"><section class="card"><div class="cardhead"><h3>Recent transactions</h3><button class="secondary" onclick="go('sales')">View all ↗</button></div>${salesTable(db.sales.slice(0,6))}</section><section class="card"><div class="cardhead"><h3>Inventory alerts</h3><span>${low.length} items</span></div>${low.length?`<div class="tablewrap"><table><thead><tr><th>Product</th><th>In stock</th></tr></thead><tbody>${low.slice(0,8).map(p=>`<tr><td>${esc(p.Name)}<br><small>${esc(p.SKU)}</small></td><td><span class="pill low">${p.Stock} left</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">✓ No low-stock items</div>'}</section></div>`}
function salesTable(sales){if(!sales.length)return '<div class="empty">No sales yet. Create your first bill to get started.</div>';return `<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Payment</th></tr></thead><tbody>${sales.map(s=>`<tr><td><strong>${esc(s.InvoiceNo)}</strong><br><small>${esc(new Date(s.DateTime).toLocaleString('en-IN'))}</small></td><td>${esc(s.CustomerName||'Walk-in')}<br><small>${esc(s.Phone||'')}</small></td><td><strong>${fmt(s.GrandTotal)}</strong></td><td><span class="pill">${esc(s.PaymentMode)}</span></td></tr>`).join('')}</tbody></table></div>`}
function productsPage(){ $('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">Catalog management</div><h2>Products</h2><p>Manage pricing, tax and stock in one place.</p></div><button class="primary" onclick="productModal()">＋ Add product</button></div><div class="card"><div class="toolbar"><input class="search" id="productSearch" placeholder="Search name, SKU or barcode…" oninput="filterProducts()"><span class="badge">${db.products.length} products</span></div><div id="productsTable"></div></div>`;filterProducts()}
function filterProducts(){let q=($('#productSearch')?.value||'').toLowerCase(),p=db.products.filter(x=>[x.Name,x.SKU,x.Category,x.Barcode].join(' ').toLowerCase().includes(q));$('#productsTable').innerHTML=p.length?`<div class="tablewrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>GST</th><th>Stock</th><th></th></tr></thead><tbody>${p.map(x=>`<tr><td><strong>${esc(x.Name)}</strong><br><small>${esc(x.Category)}</small></td><td>${esc(x.SKU)}</td><td>${fmt(x.SellingPrice)}</td><td>${x.TaxRate}%</td><td><span class="pill ${x.Stock<=x.LowStockAt?'low':'good'}">${x.Stock}</span></td><td><button class="secondary" onclick='productModal(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Edit</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No matching products. Add a product to begin.</div>'}
function customersPage(){ $('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">Customer relationships</div><h2>Customers</h2><p>Customer profiles are saved to your spreadsheet.</p></div><button class="primary" onclick="customerModal()">＋ Add customer</button></div><div class="card"><div class="toolbar"><input class="search" id="customerSearch" placeholder="Search customer name or phone…" oninput="filterCustomers()"><span class="badge">${db.customers.length} profiles</span></div><div id="customersTable"></div></div>`;filterCustomers()}
function filterCustomers(){let q=($('#customerSearch')?.value||'').toLowerCase(),cs=db.customers.filter(c=>[c.Name,c.Phone,c.Email].join(' ').toLowerCase().includes(q));$('#customersTable').innerHTML=cs.length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Customer ID</th></tr></thead><tbody>${cs.map(c=>`<tr><td><strong>${esc(c.Name)}</strong></td><td>${esc(c.Phone)}</td><td>${esc(c.Email)}</td><td>${esc(c.CustomerID)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No customers found.</div>'}
function posPage(){let q=window.productQuery||'';$('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">Point of sale</div><h2>New bill</h2><p>Search or scan a product, add customer details and check out.</p></div><span class="badge">● Sheet sync enabled</span></div><div class="poslayout"><section><div class="card"><div class="toolbar"><input class="search" id="posSearch" placeholder="Search product or scan barcode…" value="${esc(q)}" oninput="filterPosProducts()"><span class="badge">Tap a product to add</span></div><div id="posProducts" class="productgrid"></div></div></section><section class="card cartcard"><div class="cardhead"><h3>Current bill</h3><button class="secondary" onclick="clearCart()">Clear</button></div><div class="field"><label>Customer (optional)</label><input id="billCustomer" list="customerOptions" placeholder="Name or phone number" oninput="suggestCustomer()"><datalist id="customerOptions">${db.customers.map(c=>`<option value="${esc(c.Name)}">${esc(c.Phone)}</option><option value="${esc(c.Phone)}">${esc(c.Name)}</option>`).join('')}</datalist></div><div class="row"><div class="field"><label>Mobile number</label><input id="billPhone" inputmode="tel" placeholder="Phone"></div><div class="field"><label>Payment mode</label><select id="paymentMode"><option>Cash</option><option>UPI</option><option>Card</option><option>Credit</option></select></div></div><div id="cartItems"></div><div class="field" style="margin-top:14px"><label>Bill discount (₹)</label><input type="number" min="0" id="billDiscount" value="0" oninput="drawCart()"></div><div id="cartTotals"></div><button class="primary full" style="margin-top:15px" onclick="checkout()">Complete sale & print ↗</button><p class="smallnote">Stock updates only after a successful checkout.</p></section></div>`;filterPosProducts();drawCart()}
function filterPosProducts(){let q=($('#posSearch')?.value||'').toLowerCase(),p=db.products.filter(x=>[x.Name,x.SKU,x.Barcode].join(' ').toLowerCase().includes(q)&&x.Stock>0);$('#posProducts').innerHTML=p.length?p.map(x=>`<button class="producttile" onclick="addToCart('${esc(x.SKU)}')"><div><strong>${esc(x.Name)}</strong><br><small>${esc(x.SKU)} · ${x.Stock} in stock · GST ${x.TaxRate}%</small></div><div class="price">${fmt(x.SellingPrice)}</div></button>`).join(''):'<div class="empty" style="grid-column:1/-1">No available products found. Add products or update stock.</div>'}
function addToCart(sku){let p=db.products.find(x=>x.SKU===sku);if(!p)return;let x=cart.find(i=>i.SKU===sku);if(x){if(x.Qty>=p.Stock)return toast('Not enough stock');x.Qty++}else cart.push({SKU:sku,Name:p.Name,Rate:Number(p.SellingPrice),TaxRate:Number(p.TaxRate),Qty:1,Stock:p.Stock,Discount:0});drawCart()}
function changeQty(sku,d){let x=cart.find(i=>i.SKU===sku);if(!x)return;x.Qty+=d;if(x.Qty<1)cart=cart.filter(i=>i.SKU!==sku);else if(x.Qty>x.Stock){x.Qty=x.Stock;toast('Stock limit reached')}drawCart()}
function clearCart(){cart=[];drawCart()}
function drawCart(){let host=$('#cartItems');if(!host)return;host.innerHTML=cart.length?cart.map(x=>`<div class="cartitem"><div><strong>${esc(x.Name)}</strong><small>${fmt(x.Rate)} each · GST ${x.TaxRate}%</small><div class="qty"><button onclick="changeQty('${esc(x.SKU)}',-1)">−</button><span>${x.Qty}</span><button onclick="changeQty('${esc(x.SKU)}',1)">＋</button><button class="danger" onclick="cart=cart.filter(i=>i.SKU!=='${esc(x.SKU)}');drawCart()">×</button></div></div><strong>${fmt(x.Rate*x.Qty)}</strong></div>`).join(''):'<div class="empty">Your bill is empty.<br>Choose products to begin.</div>';let sub=cart.reduce((a,x)=>a+x.Rate*x.Qty,0),tax=cart.reduce((a,x)=>a+Math.max(0,x.Rate*x.Qty-x.Discount)*x.TaxRate/100,0),disc=Math.max(0,Number($('#billDiscount')?.value||0)),grand=Math.max(0,sub-disc+tax);$('#cartTotals').innerHTML=`<div class="totalrow"><span>Subtotal</span><strong>${fmt(sub)}</strong></div><div class="totalrow"><span>GST (estimated)</span><strong>${fmt(tax)}</strong></div><div class="totalrow"><span>Discount</span><strong>− ${fmt(disc)}</strong></div><div class="totalrow grand"><span>Total due</span><span>${fmt(grand)}</span></div>`}
function suggestCustomer(){let v=$('#billCustomer').value.trim().toLowerCase(),c=db.customers.find(x=>x.Name.toLowerCase()===v||x.Phone===v);if(c)$('#billPhone').value=c.Phone}
async function checkout(){if(!cart.length)return toast('Add products first');let name=$('#billCustomer').value.trim(),phone=$('#billPhone').value.trim();let c=db.customers.find(x=>x.Name.toLowerCase()===name.toLowerCase()||x.Phone===name);if(c){name=c.Name;if(!phone)phone=c.Phone}let btn=document.querySelector('.cartcard .primary');btn.disabled=true;btn.textContent='Saving sale…';try{let bill=await api('checkout',{items:cart.map(x=>({SKU:x.SKU,Qty:x.Qty,Discount:x.Discount})),discount:Number($('#billDiscount').value||0),customer:{Name:name,Phone:phone},paymentMode:$('#paymentMode').value,cashier:db.settings.Cashier||'Admin'});lastBill=bill;cart=[];await refresh();go('pos');renderReceipt(bill);window.print();toast('Sale saved · '+bill.invoice)}catch(e){toast(e.message)}finally{if(document.querySelector('.cartcard .primary')){document.querySelector('.cartcard .primary').disabled=false;document.querySelector('.cartcard .primary').textContent='Complete sale & print ↗'}}}
function renderReceipt(b){let s=db.settings||{};$('#receipt').innerHTML=`<h2>${esc(s.ShopName||'CHOPPERS MEANS WEAR')}</h2><p>${esc(s.Address||'')}</p><p>${esc(s.Phone||'')}${s.GSTIN?' · GSTIN '+esc(s.GSTIN):''}</p><div class="cut"></div><div class="rline"><span>Invoice</span><b>${esc(b.invoice)}</b></div><div class="rline"><span>Date</span><span>${new Date(b.dateTime).toLocaleString('en-IN')}</span></div><div class="rline"><span>Customer</span><span>${esc(b.customer.Name)}</span></div><div class="rline"><span>Phone</span><span>${esc(b.customer.Phone||'—')}</span></div><div class="cut"></div><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead><tbody>${b.items.map(x=>`<tr><td>${esc(x.Name)}<br><small>GST ${x.TaxRate}%</small></td><td>${x.Qty}</td><td>${Number(x.Rate).toFixed(2)}</td><td>${Number(x.LineTotal).toFixed(2)}</td></tr>`).join('')}</tbody></table><div class="cut"></div><div class="rline"><span>Subtotal</span><span>${fmt(b.subtotal)}</span></div><div class="rline"><span>Discount</span><span>−${fmt(b.discount)}</span></div><div class="rline"><span>GST</span><span>${fmt(b.tax)}</span></div><div class="rline"><b>GRAND TOTAL</b><b>${fmt(b.grandTotal)}</b></div><div class="rline"><span>Payment</span><b>${esc(b.paymentMode)}</b></div><div class="cut"></div><p class="center">Thank you for shopping with us!</p><p class="center">${esc(s.ReturnPolicy||'Exchange within 7 days with bill')}</p><p class="center">Please visit again.</p>`}
function productModal(p={}){let edit=!!p.SKU;showModal(`<div class="modalhead"><h3>${edit?'Edit product':'Add product'}</h3><button class="secondary" onclick="closeModal()">✕</button></div><form id="productForm"><div class="row"><div class="field"><label>Product name *</label><input name="Name" required value="${esc(p.Name||'')}"></div><div class="field"><label>SKU (auto if blank)</label><input name="SKU" value="${esc(p.SKU||'')}" ${edit?'readonly':''}></div></div><div class="row"><div class="field"><label>Category</label><input name="Category" value="${esc(p.Category||'Apparel')}"></div><div class="field"><label>Barcode</label><input name="Barcode" value="${esc(p.Barcode||'')}"></div></div><div class="row"><div class="field"><label>Cost price (₹)</label><input name="CostPrice" type="number" min="0" step=".01" value="${p.CostPrice||0}"></div><div class="field"><label>Selling price (₹) *</label><input name="SellingPrice" type="number" min="0" step=".01" required value="${p.SellingPrice||0}"></div></div><div class="row"><div class="field"><label>GST rate (%)</label><select name="TaxRate">${[0,5,12,18,28].map(n=>`<option ${Number(p.TaxRate||0)===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Stock quantity</label><input name="Stock" type="number" min="0" step="1" value="${p.Stock??0}"></div></div><div class="field"><label>Low stock alert at</label><input name="LowStockAt" type="number" min="0" value="${p.LowStockAt??5}"></div><button class="primary full">Save product</button></form>`);$('#productForm').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));try{await api('saveProduct',p);closeModal();await refresh();go('products');toast('Product saved')}catch(e){toast(e.message)}}}
function customerModal(){showModal(`<div class="modalhead"><h3>Add customer</h3><button class="secondary" onclick="closeModal()">✕</button></div><form id="customerForm"><div class="field"><label>Full name *</label><input name="Name" required></div><div class="row"><div class="field"><label>Mobile number</label><input name="Phone" inputmode="tel"></div><div class="field"><label>Email</label><input name="Email" type="email"></div></div><div class="field"><label>Address</label><input name="Address"></div><button class="primary full">Save customer</button></form>`);$('#customerForm').onsubmit=async e=>{e.preventDefault();try{await api('saveCustomer',Object.fromEntries(new FormData(e.target)));closeModal();await refresh();go('customers');toast('Customer saved')}catch(e){toast(e.message)}}}
function settingsPage(){let s=db.settings||{};$('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">Configure your workspace</div><h2>Store settings</h2><p>These details appear on printed receipts.</p></div></div><div class="settingsgrid"><section class="card"><h3>Business details</h3><form id="settingsForm"><div class="field"><label>Shop name</label><input name="ShopName" value="${esc(s.ShopName||'CHOPPERS MEANS WEAR')}"></div><div class="field"><label>Address / location</label><input name="Address" value="${esc(s.Address||'')}"></div><div class="row"><div class="field"><label>Contact number</label><input name="Phone" value="${esc(s.Phone||'')}"></div><div class="field"><label>GSTIN</label><input name="GSTIN" value="${esc(s.GSTIN||'')}"></div></div><div class="field"><label>Cashier name</label><input name="Cashier" value="${esc(s.Cashier||'Admin')}"></div><div class="field"><label>Return policy</label><input name="ReturnPolicy" value="${esc(s.ReturnPolicy||'Exchange within 7 days with bill')}"></div><button class="primary">Save settings</button></form></section><section class="card"><h3>Google Sheets database</h3><p class="smallnote">This app stores products, customers, sales, sale items and store settings in separate tabs of your linked spreadsheet.</p><div class="notice">Keep the spreadsheet private to your store team. Anyone with edit access can change billing and inventory records.</div><p><strong>Thermal printing</strong></p><p class="smallnote">Use the browser print dialog and choose your 58mm or 80mm receipt printer. For fully silent ESC/POS printing, a local print bridge or desktop wrapper is required.</p><button class="secondary" onclick="window.open('https://docs.google.com/spreadsheets/d/1Ac-tkxta9kGb56Do0qrGiH6wY8CgVkKq9tmLypVicck/edit','_blank')">Open linked spreadsheet ↗</button><p><a class="secondary" style="display:inline-block;text-decoration:none;margin-top:8px" href="https://script.google.com/macros/s/AKfycbyva9WNO6EHdlZVuFoSANhjIZBOhH5VIEqNghKWompVekDG0YyO4Q4B8HvIm-Dushg_/exec" target="_blank" rel="noopener">Open deployed POS web app ↗</a></p></section></div>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();try{await api('saveSettings',Object.fromEntries(new FormData(e.target)));await refresh();go('settings');toast('Settings saved')}catch(e){toast(e.message)}}}
function salesPage(){ $('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">Transaction ledger</div><h2>Sales history</h2><p>Latest completed bills and payment modes.</p></div><button class="secondary" onclick="refresh()">↻ Refresh</button></div><div class="card"><div class="toolbar"><input class="search" id="salesSearch" placeholder="Search invoice, customer or payment…" oninput="filterSales()"></div><div id="salesTable"></div></div>`;filterSales()}
function filterSales(){let q=($('#salesSearch')?.value||'').toLowerCase(),s=db.sales.filter(x=>[x.InvoiceNo,x.CustomerName,x.Phone,x.PaymentMode].join(' ').toLowerCase().includes(q));$('#salesTable').innerHTML=salesTable(s)}
function showModal(html){$('#modalHost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$('#modalHost').innerHTML=''}
refresh();
</script>
</body></html>
